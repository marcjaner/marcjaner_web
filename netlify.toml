[build]
  functions = "netlify/functions"
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Astro 7 needs Node >= 22.12.
  NODE_VERSION = "24"

[dev]
  framework = "astro"
  autoLaunch = false

[[redirects]]
  from = "/support"
  to = "https://buymeacoffee.com/marcjaner"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# One static page reads the post id from the URL.
[[redirects]]
  from = "/newsletter/rate/*"
  to = "/newsletter/rate/index.html"
  status = 200
